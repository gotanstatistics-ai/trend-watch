name: fetch trends

on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours (UTC)
  workflow_dispatch:            # the "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch trends and build the report
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m trendwatch fetch
      - name: Commit the new data
        run: |
          git config user.name "trend-watch bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push
